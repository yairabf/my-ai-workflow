name: Private package release

on: workflow_dispatch

permissions: {}

concurrency:
  group: engineering-workflows-package-release
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'yairabf/my-ai-workflow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Stage and inspect the package
        run: bash .github/scripts/pack-engineering-workflows "$RUNNER_TEMP"
